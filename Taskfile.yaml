version: "3"

tasks:
  up:
    desc: starts docker compose services
    cmd: docker compose up -d

  down:
    desc: stops docker compose services
    cmd: docker compose down

  install-deps:
    desc: install dependencies
    run: once
    cmd: go get ./...
    sources:
      - go.mod
      - go.sum

  build:app:
    desc: builds app
    deps:
      - install-deps
    cmd: go build -o bin/app cmd/app/app.go
    sources:
      - ./**/*.go
    generates:
      - bin/app

  build:worker:
    desc: builds worker
    deps:
      - install-deps
    cmd: go build -o bin/worker cmd/worker/worker.go
    sources:
      - ./**/*.go
    generates:
      - bin/worker

  build:migrate:
    desc: builds migrate
    deps:
      - install-deps
    cmd: go build -o bin/migrate cmd/migrate/migrate.go
    sources:
      - ./cmd/migrate/migrate.go
      - ./cmd/migrate/migrations/*.sql
    generates:
      - bin/migrate

  migrate-up:
    desc: run migrations
    deps:
      - build:migrate
    cmd: bin/migrate up
    sources:
      - /bin/migrate
    status:
      - bin/migrate status 2>&1 | grep -q "Pending" && exit 1 || exit 0

  build:
    desc: builds app, worker and migrate
    cmds:
      - task: build:app
      - task: build:worker
      - task: build:migrate

  clean:
    desc: cleans generated binaries and caches
    cmds:
      - rm -f bin/*
      - go clean -cache -testcache -fuzzcache

  format:
    desc: runs all formatters
    deps:
      - format:go
      - format:mise
      - format:yaml
      - format:sql

  format:go:
    desc: formats go files
    cmd: golangci-lint fmt
    sources:
      - .golangci.yaml
      - ./**/*.go

  format:mise:
    desc: format mise config
    cmd: mise fmt
    sources:
      - .mise.toml

  format:yaml:
    desc: format yaml
    cmd: yamlfmt -formatter indent=2,retain_line_breaks=true ./**/*.yaml ./.github/workflows/*.yaml
    sources:
      - ./**/*.yaml
      - ./.github/workflows/*.yaml

  format:sql:
    desc: formats sql files
    cmd: sqruff fix
    sources:
      - ./cmd/migrate/migrations/*.sql

  lint:
    desc: runs all linters
    deps:
      - lint:go
      - lint:dockerfile
      - lint:sql

  lint:go:
    desc: lints go code
    deps:
      - install-deps
    cmd: golangci-lint run
    sources:
      - .golangci.yaml
      - ./**/*.go

  lint:dockerfile:
    desc: lints Dockerfile
    cmd: hadolint Dockerfile
    sources:
      - Dockerfile

  lint:sql:
    desc: lints sql files
    cmd: sqruff lint .
    sources:
      - ./cmd/migrate/migrations/*.sql

  test:
    desc: runs tests
    deps:
      - install-deps
    cmd: go test ./...

  test-load:
    desc: runs load tests
    cmd: k6 run test/k6/load-test.js

  gitleaks:
    desc: runs gitleaks
    cmd: gitleaks detect .

  setup:
    desc: sets up the project
    cmds:
      - task: up
      - task: install-deps
      - task: migrate-up

  ci:
    desc: runs standard checks
    deps:
      - gitleaks
      - format
      - lint
      - migrate-up
    cmd:
      task: test
